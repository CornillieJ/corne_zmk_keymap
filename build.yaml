# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano//zmk
#     shield: reviung41
#   - board: nice_nano//zmk
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
  # Dongle acts as the BLE central and USB host device.
  - board: nrf52840_mdk_usb_dongle
    shield: corne_dongle
  # Both halves are now peripherals; the dongle is central.
  - board: nice_nano//zmk
    shield: corne_right nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: nice_nano//zmk
    shield: corne_left nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  # Temporary debug builds with USB serial logging, to see why the fixed
  # firmware still shows the same connect/disconnect flicker.
  - board: nice_nano//zmk
    shield: corne_left nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    snippet: zmk-usb-logging
    artifact-name: corne_left_debug_logging
  - board: nrf52840_mdk_usb_dongle
    shield: corne_dongle
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
    artifact-name: corne_dongle_debug_logging
  # Flash these on all three controllers first to clear old pairing/bond data
  # before flashing the firmware above.
  - board: nrf52840_mdk_usb_dongle
    shield: settings_reset
  - board: nice_nano//zmk
    shield: settings_reset
