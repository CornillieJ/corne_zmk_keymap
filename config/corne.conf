# LED setup
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_PER_KEY=y
# Startup effect (0 = solid color, 1 = breathing, 2 = spectrum, 3 = swirl)
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=2
# Set the number of LEDs used for underglow
CONFIG_ZMK_RGB_UNDERGLOW_LED_START=0
CONFIG_ZMK_RGB_UNDERGLOW_LED_END=5
# Optional: Adjust brightness, saturation, etc. for underglow
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=50
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0

# Optional: Adjust brightness, saturation, etc. for per-key
CONFIG_ZMK_RGB_UNDERGLOW_PER_KEY_BRT_START=50
CONFIG_ZMK_RGB_UNDERGLOW_PER_KEY_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_PER_KEY_HUE_START=180





CONFIG_ZMK_DISPLAY=y
# CONFIG_ZMK_BACKLIGHT=y
### Power
CONFIG_ZMK_SLEEP=y # Enable deep sleep support
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_IDLE_TIMEOUT=120000

# Make Bluetooth stronger
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y